{% extends "dashboard_base.html" %}

{% block title %}Menú de Configuración{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">⚙️ Panel de Configuración</h2>
    <div class="row g-4">

        <!-- Tarjeta: Temas de Soporte -->
        <div class="col-md-4">
            <a href="{{ url_for('catalogos.vista_temas') }}" class="text-decoration-none">
                <div class="card text-center shadow h-100">
                    <div class="card-body">
                        <i class="fas fa-building fa-3x mb-2 text-primary"></i>
                        <h5 class="card-title">Catálogo de Tipo de fallas</h5>
                        <p class="card-text">Gestiona los tipos de falla.</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- Tarjeta: Áreas -->
        <div class="col-md-4">
            <a href="{{ url_for('catalogos.vista_areas') }}" class="text-decoration-none">
                <div class="card text-center shadow h-100">
                    <div class="card-body">
                        <i class="fas fa-sitemap fa-3x mb-2 text-success"></i>
                        <h5 class="card-title">Catálogo de Áreas</h5>
                        <p class="card-text">Administra las áreas disponibles.</p>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>
{% endblock %}
